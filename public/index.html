<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Express To-Do App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div class="aurora"></div>
  <main class="container py-5">
    <section class="card shadow-lg glass">
      <div class="card-body p-4 p-md-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
          <div>
            <h1 class="h2 mb-1">My Learning To-Do Board</h1>
            <p class="text-muted mb-0">Built with pure Express + vanilla JS + Bootstrap.</p>
          </div>
          <div id="stats" class="badge text-bg-dark fs-6">0 tasks</div>
        </div>

        <form id="todoForm" class="row g-3 mb-4">
          <div class="col-md-5">
            <input id="title" class="form-control" placeholder="Task title" maxlength="80" required>
          </div>
          <div class="col-md-5">
            <input id="details" class="form-control" placeholder="Details (optional)" maxlength="160">
          </div>
          <div class="col-md-2 d-grid">
            <button class="btn btn-primary" type="submit">Add Task</button>
          </div>
        </form>

        <div class="d-flex gap-2 mb-3 flex-wrap">
          <button class="btn btn-outline-secondary filter-btn active" data-filter="all">All</button>
          <button class="btn btn-outline-secondary filter-btn" data-filter="active">Active</button>
          <button class="btn btn-outline-secondary filter-btn" data-filter="completed">Completed</button>
        </div>

        <div id="alertBox"></div>
        <ul id="todoList" class="list-group list-group-flush"></ul>
      </div>
    </section>
  </main>
  <script src="/js/app.js" defer></script>
</body>
</html>
